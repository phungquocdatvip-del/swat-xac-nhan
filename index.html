<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đặt hàng Online</title>
<style>
body { font-family: Arial; background: #f4f4f4; padding: 20px; }
h1 { text-align: center; color: #333; margin-bottom: 20px; }
form { max-width: 500px; margin: auto; background: #fff; padding: 20px; border-radius: 8px; }
input, select { width: 100%; padding: 10px; margin: 10px 0; border-radius: 4px; border: 1px solid #ccc; }
button { padding: 10px 20px; background: #007BFF; color: white; border: none; border-radius: 4px; cursor: pointer; }
button:hover { background: #0056b3; }
</style>
</head>
<body>

<h1>Đặt hàng Online</h1>

<form id="orderForm">
    <label>Họ và tên:</label>
    <input type="text" id="name" required>
    
    <label>Email:</label>
    <input type="email" id="email" required>
    
    <label>Số điện thoại:</label>
    <input type="text" id="phone" required>
    
    <label>Địa chỉ nhận hàng:</label>
    <input type="text" id="address" required>
    
    <label>Sản phẩm:</label>
    <select id="product" required>
        <option value="">-- Chọn sản phẩm --</option>
        <option value="Áo Thun">Áo Thun</option>
        <option value="Quần Jean">Quần Jean</option>
        <option value="Giày">Giày</option>
    </select>
    
    <label>Số lượng:</label>
    <input type="number" id="qty" min="1" value="1" required>
    
    <button type="submit">Gửi đơn hàng</button>
</form>

<script>
// Lấy dữ liệu từ LocalStorage hoặc tạo mới
let orders = JSON.parse(localStorage.getItem("orders")) || [];

// Xử lý gửi đơn hàng
document.getElementById("orderForm").addEventListener("submit", function(e){
    e.preventDefault();
    
    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const phone = document.getElementById("phone").value;
    const address = document.getElementById("address").value;
    const product = document.getElementById("product").value;
    const qty = parseInt(document.getElementById("qty").value);

    const totalPrice = product=="Áo Thun"?200000:product=="Quần Jean"?500000:800000;

    const order = {
        id: Date.now(),
        name, email, phone, address,
        product, qty, total: totalPrice*qty,
        status: "Chờ xác nhận"
    };

    orders.push(order);
    localStorage.setItem("orders", JSON.stringify(orders));
    alert("Đặt hàng thành công!");
    this.reset();
});
</script>

</body>
</html>
